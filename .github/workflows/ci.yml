name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout abi_executor_bot (sibling, for contract tests)
        run: git clone --depth 1 https://github.com/roman-vyl/abi_executor_bot.git "${GITHUB_WORKSPACE}/../abi_executor_bot"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (python)
        run: make install-dev

      - name: Verify (lint + format-check + typecheck + test)
        run: make verify

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install (node tooling)
        run: npm install

      - name: OpenSpec strict validation
        run: npm run openspec:validate
