  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-switch .form-check-input:focus-visible {

.form-range {

  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

  height: 20px;

.form-range:focus-visible::-moz-range-thumb {

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

}

}

}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;runtime-abi-chain-map&quot;&gt;
  &lt;div class=&quot;viz-controls&quot; role=&quot;group&quot; aria-label=&quot;Выбор представления&quot;&gt;

    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;closed&quot; aria-pressed=&quot;false&quot;&gt;Closed-bar → ABI&lt;/button&gt;

  &lt;div class=&quot;chain-legend&quot; aria-label=&quot;Легенда статусов&quot;&gt;

&lt;style&gt;
  #runtime-abi-chain-map {
    width: 100%;

  }

  #runtime-abi-chain-map .viz-controls {

  }

  #runtime-abi-chain-map .chain-heading {

    margin: 0 0 10px;

  #runtime-abi-chain-map .chain-heading h3 {
    margin: 0;
  }

  #runtime-abi-chain-map .lane-headings,
  #runtime-abi-chain-map .flow-row {
    display: grid;

  }

  #runtime-abi-chain-map .lane-headings {
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted-foreground);
    text-align: center;
  }

  #runtime-abi-chain-map .chain-flow {
    position: relative;
    padding-top: 6px;
  }

  #runtime-abi-chain-map .flow-step {
    position: relative;
  }

  #runtime-abi-chain-map .edge-label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    color: var(--muted-foreground);
    text-align: center;
  }

  #runtime-abi-chain-map .edge-label::before,
  #runtime-abi-chain-map .edge-label::after {
    content: &quot;&quot;;
    height: 1px;
    flex: 1 1 auto;
    background: var(--border);
  }

  #runtime-abi-chain-map .edge-label span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
  }

  #runtime-abi-chain-map .edge-label i {
    display: inline-flex;
  }

  #runtime-abi-chain-map .flow-row {
    align-items: stretch;
  }

  #runtime-abi-chain-map .flow-node {
    position: relative;
    min-height: 72px;
    padding: 10px 11px 10px 14px;
    border-left: 4px solid var(--border);
    border-radius: 6px;
    background: color-mix(in srgb, var(--muted) 36%, transparent);
  }

  #runtime-abi-chain-map .flow-node.status-current {
    border-left-color: var(--viz-series-1);
    background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
  }

  #runtime-abi-chain-map .flow-node.status-planned {
    border-left-color: var(--viz-series-2);
    background: color-mix(in srgb, var(--viz-series-2) 10%, transparent);
  }

  #runtime-abi-chain-map .flow-node.status-gap {
    border-left-color: var(--viz-series-3);
    background: color-mix(in srgb, var(--viz-series-3) 11%, transparent);
  }

  #runtime-abi-chain-map .flow-node.status-deferred {
    border-left-color: var(--muted-foreground);
    background: color-mix(in srgb, var(--muted) 46%, transparent);
  }

  #runtime-abi-chain-map .node-topline {
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }

  #runtime-abi-chain-map .step-number {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--secondary);
    color: var(--secondary-foreground);
  }

  #runtime-abi-chain-map .node-title {
    min-width: 0;
    overflow-wrap: anywhere;
    font-weight: 500;
  }

  #runtime-abi-chain-map .node-detail {
    margin-top: 5px;
    color: var(--muted-foreground);
    overflow-wrap: anywhere;
  }

  #runtime-abi-chain-map .node-detail code {
    color: var(--foreground);
  }

  #runtime-abi-chain-map .node-status {
    display: inline-block;
    margin-top: 7px;
    color: var(--muted-foreground);
  }

  #runtime-abi-chain-map .progress-check {
    margin-top: 9px;
  }

  #runtime-abi-chain-map .flow-node.is-completed {
    border-left-color: var(--viz-series-1);
    background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
  }

  #runtime-abi-chain-map .chain-gates {
    margin-top: 14px;
    padding: 12px 14px;
  }

  #runtime-abi-chain-map .chain-gates strong {
    font-weight: 500;
  }

  #runtime-abi-chain-map .gate-list {
    display: grid;
    gap: 6px;

  @media (max-width: 560px) {
    #runtime-abi-chain-map .lane-headings {
      display: none;

    #runtime-abi-chain-map .flow-row {

    #runtime-abi-chain-map .flow-node::before {

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;runtime-abi-chain-map&quot;);
    const title = root.querySelector(&quot;#chain-view-title&quot;);
    const caption = root.querySelector(&quot;#chain-view-caption&quot;);
    const flow = root.querySelector(&quot;#chain-flow&quot;);
    const gates = root.querySelector(&quot;#chain-gates&quot;);
    const buttons = Array.from(root.querySelectorAll(&quot;[data-view]&quot;));
    const laneLabels = [
      &quot;Ingress / utility&quot;,
      &quot;Runtime application&quot;,
      &quot;State / coordination&quot;,
      &quot;External systems&quot;
    ];

    const views = {
      current: {
        title: &quot;Фактическая цепочка в текущем репозитории&quot;,
        caption: &quot;Семантический контур реализован; production composition пока обрывается на handoff.&quot;,
        steps: [
          {
            lane: 0,
            title: &quot;POST /v1/webhooks/closed-bar&quot;,
            detail: &quot;FastAPI принимает &lt;code&gt;ClosedBarRequest&lt;/code&gt; и ставит background task.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;CommittedBarEvent&quot;,
            lane: 0,
            title: &quot;CommittedBarOrchestrator.process&quot;,
            detail: &quot;Запускает журналирование и fan-out одной закрытой свечи.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;snapshot → selected deployments&quot;,
            lane: 0,
            title: &quot;FilesystemDeploymentCatalog → CommittedBarDeploymentSelector&quot;,
            detail: &quot;Находит JSON-спеки, выводит &lt;code&gt;strategy_instance_id&lt;/code&gt;, отбирает enabled + ticker + timeframe.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;по одному StrategyBarProcessingUnit&quot;,
            lane: 0,
            title: &quot;StrategyCycleHandoffBoundary.dispatch&quot;,
            detail: &quot;В production composition это текущая конечная точка utility-контура.&quot;,
            status: &quot;gap&quot;,
            note: &quot;разрыв production wiring&quot;
          },
          {
            edge: &quot;sink должен вызвать semantic pipeline&quot;,
            lane: 1,
            title: &quot;StrategyRuntimeOrchestrator.process&quot;,
            detail: &quot;Скалярная цепочка реализована и покрыта unit-тестами, но не подключена в &lt;code&gt;build_application&lt;/code&gt;.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;get_or_create&quot;,
            lane: 2,
            title: &quot;StrategyInstanceRuntimeStateRepository&quot;,
            detail: &quot;In-memory aggregate; сейчас порт умеет только &lt;code&gt;get_or_create&lt;/code&gt;.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;state → position facts&quot;,
            lane: 1,
            title: &quot;OpenPositionResolver.resolve&quot;,
            detail: &quot;Запрашивает ABI по &lt;code&gt;strategy_instance_id&lt;/code&gt; и возвращает transient position facts.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;AbiOpenPositionLookupPort.lookup&quot;,
            lane: 3,
            title: &quot;ABI open-position lookup&quot;,
            detail: &quot;Порт и модели готовы; production HTTP adapter пока является заглушкой.&quot;,
            status: &quot;gap&quot;,
            note: &quot;HTTP adapter stub&quot;
          },
          {
            edge: &quot;PositionResolvedStrategyInstance&quot;,
            lane: 1,
            title: &quot;StrategyUseCaseRouter.route&quot;,
            detail: &quot;&lt;code&gt;position_open=false&lt;/code&gt; → live-entry; &lt;code&gt;true&lt;/code&gt; → open-trade с проверкой frozen context.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;projection request&quot;,
            lane: 3,
            title: &quot;Strategy Engine&quot;,
            detail: &quot;&lt;code&gt;project_live_entry&lt;/code&gt; или &lt;code&gt;project_open_trade&lt;/code&gt;; production HTTP client пока является заглушкой.&quot;,
            status: &quot;gap&quot;,
            note: &quot;HTTP adapter stub&quot;
          },
          {
            edge: &quot;typed in-memory result&quot;,
            lane: 1,
            title: &quot;LiveEntryProjectedStrategyInstance | OpenTradeProjectedStrategyInstance&quot;,
            detail: &quot;Текущая semantic цепочка здесь заканчивается, состояние не мутируется.&quot;,
            status: &quot;current&quot;
          }
        ],
        gates: [
          &quot;Подключить &lt;code&gt;StrategyRuntimeOrchestrator&lt;/code&gt; как sink handoff-границы в production composition.&quot;,
          &quot;Реализовать production HTTP adapters для ABI position lookup и Strategy Engine, если они не поставляются внешней композицией.&quot;,
          &quot;Новый entry-контур должен начинаться после typed projection, не внутри router.&quot;
        ]
      },
      closed: {
        title: &quot;Целевая closed-bar цепочка после live-entry projection&quot;,
        caption: &quot;Один keyed mutex держится от загрузки состояния до ABI acknowledgement и save.&quot;,
        steps: [
          {
            lane: 1,
            title: &quot;ProjectionOrchestrator&quot;,
            detail: &quot;Возвращает существующий &lt;code&gt;LiveEntryProjectedStrategyInstance&lt;/code&gt; как typed in-memory object.&quot;,
            status: &quot;current&quot;
          },
          {
            edge: &quot;projection + strategy_instance_id&quot;,
            lane: 2,
            title: &quot;KeyedMutex.acquire(strategy_instance_id)&quot;,
            detail: &quot;Общий process-local mutex для reconciliation и fill webhook.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;после захвата mutex&quot;,
            lane: 2,
            title: &quot;Repository.get_or_create / reload&quot;,
            detail: &quot;Загружает свежий aggregate с &lt;code&gt;risk_multiplier&lt;/code&gt; и optional &lt;code&gt;CurrentTradeCycle&lt;/code&gt;.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;new desired vs applied desired&quot;,
            lane: 1,
            title: &quot;EntryDiff.decide&quot;,
            detail: &quot;Чистое решение: &lt;code&gt;NO_OP | APPLY | REPLACE | CANCEL&lt;/code&gt;.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;NO_OP завершает; остальные строят command&quot;,
            lane: 2,
            title: &quot;Trade-cycle identity selection&quot;,
            detail: &quot;&lt;code&gt;APPLY&lt;/code&gt; резервирует новый id до вызова ABI; &lt;code&gt;REPLACE/CANCEL&lt;/code&gt; используют id текущего цикла.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;EntryPackageRequest&quot;,
            lane: 1,
            title: &quot;AbiEntryPackagePort.send&quot;,
            detail: &quot;DTO + scalar port из готового OpenSpec &lt;code&gt;abi-entry-package-client-v1&lt;/code&gt;.&quot;,
            status: &quot;planned&quot;
          },
          {
            edge: &quot;один bounded PUT, без retry/redirect&quot;,
            lane: 3,
            title: &quot;PUT …/trade-cycles/{trade_cycle_id}/entry-package&quot;,
            detail: &quot;&lt;code&gt;ticker + desired_entry|null + risk_multiplier&lt;/code&gt;; strict JSON contract.&quot;,
            status: &quot;planned&quot;
          },
          {
            edge: &quot;200 success | public ABI error | typed failure&quot;,
            lane: 1,
            title: &quot;Strict decode + identity binding&quot;,
            detail: &quot;Success допустим только при совпадении обоих Runtime-owned identifiers.&quot;,
            status: &quot;planned&quot;
          },
          {
            edge: &quot;valid acknowledgement only&quot;,
            lane: 2,
            title: &quot;Entry result applier → Repository.save&quot;,
            detail: &quot;APPLY создаёт cycle; REPLACE обновляет awaiting entry; CANCEL/absent очищает cycle; failure сохраняет прежнее состояние.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;finally&quot;,
            lane: 2,
            title: &quot;KeyedMutex.release&quot;,
            detail: &quot;Освобождается на success, rejection, timeout и любом exception path.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;OpenTradeProjectedStrategyInstance&quot;,
            lane: 1,
            title: &quot;Position-management reconciliation&quot;,
            detail: &quot;Не входит в live-entry master plan и проектируется отдельно.&quot;,
            status: &quot;deferred&quot;
          }
        ],
        gates: [
          &quot;Свести расхождение статусов отмены: master plan говорит &lt;code&gt;entry_package_cancelled&lt;/code&gt;, утверждённый client contract — &lt;code&gt;entry_package_absent&lt;/code&gt;.&quot;,
          &quot;Зафиксировать минимальный persisted acknowledgement: client DTO несёт desired entry, accepted multiplier и quantity, но master plan также упоминает order/stop/take references.&quot;,
          &quot;До ABI acknowledgement новый &lt;code&gt;trade_cycle_id&lt;/code&gt; существует как локально зарезервированная identity, но &lt;code&gt;CurrentTradeCycle&lt;/code&gt; ещё не создаётся.&quot;
        ]
      },
      webhook: {
        title: &quot;Независимая цепочка ABI execution event&quot;,
        caption: &quot;Webhook не продолжает MDS request; обе цепочки встречаются только через mutex и repository.&quot;,
        steps: [
          {
            lane: 3,
            title: &quot;ABI emits entry fill&quot;,
            detail: &quot;Partial или final fill, привязанный к &lt;code&gt;strategy_instance_id + trade_cycle_id&lt;/code&gt;.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;отдельный HTTP request&quot;,
            lane: 0,
            title: &quot;POST Runtime ABI fill webhook&quot;,
            detail: &quot;Точное имя endpoint в master plan пока отложено.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;parse + validate&quot;,
            lane: 1,
            title: &quot;AbiEntryFillEvent DTO&quot;,
            detail: &quot;Проверяет identity, quantities, prices, cumulative fields и &lt;code&gt;occurred_at_ms&lt;/code&gt;.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;strategy_instance_id&quot;,
            lane: 2,
            title: &quot;Shared KeyedMutex.acquire&quot;,
            detail: &quot;Тот же mutex, что у closed-bar reconciliation.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;load after lock&quot;,
            lane: 2,
            title: &quot;Repository.get current aggregate&quot;,
            detail: &quot;Нельзя применять snapshot, загруженный до ожидания mutex.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;validate ownership pair&quot;,
            lane: 1,
            title: &quot;AbiExecutionEventOrchestrator&quot;,
            detail: &quot;Требует matching &lt;code&gt;CurrentTradeCycle&lt;/code&gt;; HTTP handler сам aggregate не мутирует.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;apply cumulative fill&quot;,
            lane: 2,
            title: &quot;CurrentTradeCycle.apply_fill&quot;,
            detail: &quot;Сохраняет filled/remaining/average + first/last fill timestamps.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;first real exposure&quot;,
            lane: 2,
            title: &quot;Freeze executed entry context&quot;,
            detail: &quot;Первый fill замораживает applied desired entry и execution facts.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;state transition&quot;,
            lane: 2,
            title: &quot;awaiting_entry → partially_filled → position_open&quot;,
            detail: &quot;Immediate full fill переводит напрямую в &lt;code&gt;position_open&lt;/code&gt;.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;save complete aggregate&quot;,
            lane: 2,
            title: &quot;Repository.save → release mutex&quot;,
            detail: &quot;После save следующий closed-bar снова проверит authoritative ABI position fact.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;later reliability gate&quot;,
            lane: 2,
            title: &quot;Durable fill dedup / recovery / CAS&quot;,
            detail: &quot;Не входит в Live V1; обязательно до multi-worker или multi-replica.&quot;,
            status: &quot;deferred&quot;
          }
        ],
        gates: [
          &quot;До реализации подтвердить у ABI/Bybit источник cumulative quantity и average entry price.&quot;,
          &quot;Поздние callbacks и cancel/fill race в Live V1 принимаются как остаточный риск; нужен явный test matrix.&quot;,
          &quot;Деплой Live V1 должен реально запрещать несколько workers/replicas, иначе process-local mutex не обеспечивает инвариант.&quot;
        ]
      },
      increments: {
        title: &quot;Рекомендуемый порядок поставки&quot;,
        caption: &quot;Каждый инкремент оставляет проверяемый, но архитектурно завершённый шов.&quot;,
        steps: [
          {
            id: &quot;i1-abi-client&quot;,
            trackable: true,
            lane: 0,
            span: 4,
            title: &quot;I1 · ABI entry-package client&quot;,
            detail: &quot;Выполнить текущий OpenSpec: wire DTOs, scalar port, HTTP adapter, strict decoding, fake ABI и OpenAPI conformance. Никакого wiring.&quot;,
            status: &quot;planned&quot;,
            note: &quot;активный OpenSpec&quot;
          },
          {
            id: &quot;i2-state-foundation&quot;,
            trackable: true,
            edge: &quot;I1 даёт надёжный outbound seam&quot;,
            lane: 0,
            span: 4,
            title: &quot;I2 · Aggregate + repository + shared mutex foundation&quot;,
            detail: &quot;Добавить &lt;code&gt;risk_multiplier=&amp;quot;1&amp;quot;&lt;/code&gt;, целевой &lt;code&gt;CurrentTradeCycle&lt;/code&gt;, phase/frozen context, &lt;code&gt;get/save&lt;/code&gt;, id factory и keyed-mutex registry.&quot;,
            status: &quot;gap&quot;
          },
          {
            id: &quot;i3-pure-reconciliation&quot;,
            trackable: true,
            edge: &quot;I2 даёт атомарную точку мутации&quot;,
            lane: 0,
            span: 4,
            title: &quot;I3 · Pure entry reconciliation&quot;,
            detail: &quot;Реализовать equivalence, &lt;code&gt;NO_OP/APPLY/REPLACE/CANCEL&lt;/code&gt;, command builder и acknowledgement applier как чистые компоненты со state-machine tests.&quot;,
            status: &quot;gap&quot;
          },
          {
            id: &quot;i4-closed-bar-orchestration&quot;,
            trackable: true,
            edge: &quot;I1 + I2 + I3&quot;,
            lane: 0,
            span: 4,
            title: &quot;I4 · Closed-bar reconciliation orchestration&quot;,
            detail: &quot;Добавить &lt;code&gt;EntryReconciliationOrchestrator&lt;/code&gt;, удержание mutex вокруг load → ABI → save, production composition и failure preservation.&quot;,
            status: &quot;gap&quot;
          },
          {
            id: &quot;i5-fill-webhook&quot;,
            trackable: true,
            edge: &quot;acknowledged cycle уже существует&quot;,
            lane: 0,
            span: 4,
            title: &quot;I5 · ABI fill webhook + execution state machine&quot;,
            detail: &quot;DTO/HTTP endpoint, &lt;code&gt;AbiExecutionEventOrchestrator&lt;/code&gt;, shared mutex, freeze on first fill, cumulative fill storage и phase transitions.&quot;,
            status: &quot;gap&quot;
          },
          {
            id: &quot;i6-e2e-guardrails&quot;,
            trackable: true,
            edge: &quot;обе writer-цепочки готовы&quot;,
            lane: 0,
            span: 4,
            title: &quot;I6 · Cross-flow E2E и live guardrails&quot;,
            detail: &quot;Fake ABI end-to-end, contention tests, cancel/fill race matrix, timeout paths, journal/metrics и проверяемый single-worker deployment guard.&quot;,
            status: &quot;gap&quot;
          },
          {
            edge: &quot;следующая отдельная программа работ&quot;,
            lane: 0,
            span: 4,
            title: &quot;Position-management + stronger reliability&quot;,
            detail: &quot;Protection/close reconciliation, durable persistence, idempotency, recovery, CAS и horizontal scaling.&quot;,
            status: &quot;deferred&quot;
          }
        ],
        gates: [
          &quot;I1 можно реализовать изолированно прямо сейчас: его OpenSpec уже полный и специально не меняет active flow.&quot;,
          &quot;I2–I6 лучше оформить отдельными OpenSpec changes, чтобы state model, orchestration и webhook не смешались в один большой change.&quot;,
          &quot;Главная зависимость: I4 нельзя считать завершённым без I1–I3; I5 опирается на acknowledged cycle, создаваемый I4.&quot;
        ]
      }
    };

    const progressStorageKey = &quot;strategy-runtime.runtime-abi-entry-delivery-progress.v1&quot;;

    function loadProgress() {
      try {
        const parsed = JSON.parse(localStorage.getItem(progressStorageKey) || &quot;{}&quot;);
        return parsed &amp;&amp; typeof parsed === &quot;object&quot; ? parsed : {};
      } catch (_error) {
        return {};
      }
    }

    function saveProgress(progress) {
      try {
        localStorage.setItem(progressStorageKey, JSON.stringify(progress));
      } catch (_error) {
        // The visual remains usable when browser storage is unavailable.
      }
    }

    function render(viewName) {
      const view = views[viewName];
      const progress = loadProgress();
      title.textContent = view.title;
      caption.textContent = view.caption;
      flow.replaceChildren();

      view.steps.forEach((step, index) =&gt; {
        const wrapper = document.createElement(&quot;div&quot;);
        wrapper.className = &quot;flow-step&quot;;
        wrapper.setAttribute(&quot;role&quot;, &quot;listitem&quot;);

        if (step.edge) {
          const edge = document.createElement(&quot;div&quot;);
          edge.className = &quot;edge-label&quot;;
          edge.innerHTML = `&lt;span&gt;&lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${step.edge}&lt;/span&gt;`;
          wrapper.appendChild(edge);
        }

        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;flow-row&quot;;

        const node = document.createElement(&quot;div&quot;);
        node.className = `flow-node status-${step.status}`;
        node.style.gridColumn = `${step.lane + 1} / span ${step.span || 1}`;
        node.dataset.laneLabel = step.span === 4 ? &quot;Cross-cutting increment&quot; : laneLabels[step.lane];

        const topline = document.createElement(&quot;div&quot;);
        topline.className = &quot;node-topline&quot;;
        topline.innerHTML = `&lt;span class=&quot;step-number&quot;&gt;${index + 1}&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;${step.title}&lt;/span&gt;`;
        node.appendChild(topline);

        const detail = document.createElement(&quot;div&quot;);
        detail.className = &quot;node-detail&quot;;
        detail.innerHTML = step.detail;
        node.appendChild(detail);

        if (step.note) {
          const note = document.createElement(&quot;span&quot;);
          note.className = &quot;node-status&quot;;
          note.textContent = step.note;
          node.appendChild(note);
        }

        if (step.trackable) {
          const completed = progress[step.id] === true;
          node.classList.toggle(&quot;is-completed&quot;, completed);

          const check = document.createElement(&quot;div&quot;);
          check.className = &quot;form-check progress-check&quot;;

          const input = document.createElement(&quot;input&quot;);
          input.className = &quot;form-check-input&quot;;
          input.type = &quot;checkbox&quot;;
          input.id = `progress-${step.id}`;
          input.checked = completed;

          const label = document.createElement(&quot;label&quot;);
          label.className = &quot;form-check-label&quot;;
          label.htmlFor = input.id;
          label.textContent = &quot;Выполнено&quot;;

          input.addEventListener(&quot;change&quot;, () =&gt; {
            progress[step.id] = input.checked;
            saveProgress(progress);
            node.classList.toggle(&quot;is-completed&quot;, input.checked);
          });

          check.append(input, label);
          node.appendChild(check);
        }

        row.appendChild(node);
        wrapper.appendChild(row);
        flow.appendChild(wrapper);
      });

      gates.innerHTML = `&lt;strong&gt;Архитектурные ворота&lt;/strong&gt;&lt;ul class=&quot;gate-list&quot;&gt;${view.gates.map((gate) =&gt; `&lt;li&gt;${gate}&lt;/li&gt;`).join(&quot;&quot;)}&lt;/ul&gt;`;

      buttons.forEach((button) =&gt; {
        const selected = button.dataset.view === viewName;
        button.classList.toggle(&quot;btn-primary&quot;, selected);
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      });

      if (typeof lucide !== &quot;undefined&quot;) {
        lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }
    }

    buttons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; render(button.dataset.view));
    });

    render(&quot;current&quot;);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
