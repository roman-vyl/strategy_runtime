            lane: 0,
            span: 4,
            title: "Stronger reliability and scale",
            detail: "Durable persistence, idempotency, recovery, CAS и horizontal scaling.",
            status: "deferred"
          }
        ],
        gates: [
          "ABI client, state foundation, pure reconciliation и entry application operation реализованы и архивированы; следующий increment — closed-bar Runtime orchestration.",
          "Production adapter/composition scope определяется отдельным более поздним integration seam после проверки фактических интерфейсов.",
          "ABI fill webhook и entry/fill cross-flow остаются последующими отдельными changes.",
          "Финальный full Live V1 E2E возможен только после дизайна и реализации open-trade branch."
        ]
      }
    };

    const progressStorageKey = "strategy-runtime.runtime-abi-entry-delivery-progress.v1";

    function loadProgress() {
      try {
        const parsed = JSON.parse(localStorage.getItem(progressStorageKey) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (_error) {
        return {};
      }
    }

    function saveProgress(progress) {
      try {
        localStorage.setItem(progressStorageKey, JSON.stringify(progress));
      } catch (_error) {
        // The visual remains usable when browser storage is unavailable.
      }
    }

    function render(viewName) {
      const view = views[viewName];
      const progress = loadProgress();
      title.textContent = view.title;
      caption.textContent = view.caption;
      flow.replaceChildren();

      view.steps.forEach((step, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "flow-step";
        wrapper.setAttribute("role", "listitem");

        if (step.edge) {
          const edge = document.createElement("div");
          edge.className = "edge-label";
          edge.innerHTML = `<span><i data-lucide="arrow-down" aria-hidden="true"></i>${step.edge}</span>`;
          wrapper.appendChild(edge);
        }

        const row = document.createElement("div");
        row.className = "flow-row";

        const node = document.createElement("div");
        node.className = `flow-node status-${step.status}`;
        node.style.gridColumn = `${step.lane + 1} / span ${step.span || 1}`;
        node.dataset.laneLabel = step.span === 4 ? "Cross-cutting increment" : laneLabels[step.lane];

        const topline = document.createElement("div");
        topline.className = "node-topline";
        topline.innerHTML = `<span class="step-number">${index + 1}</span><span class="node-title">${step.title}</span>`;
        node.appendChild(topline);

        const detail = document.createElement("div");
        detail.className = "node-detail";
        detail.innerHTML = step.detail;
        node.appendChild(detail);

        if (step.note) {
          const note = document.createElement("span");
          note.className = "node-status";
          note.textContent = step.note;
          node.appendChild(note);
        }

        if (step.trackable) {
          const completed = progress[step.id] === true;
          node.classList.toggle("is-completed", completed);

          const check = document.createElement("div");
          check.className = "form-check progress-check";

          const input = document.createElement("input");
          input.className = "form-check-input";
          input.type = "checkbox";
          input.id = `progress-${step.id}`;
          input.checked = completed;

          const label = document.createElement("label");
          label.className = "form-check-label";
          label.htmlFor = input.id;
          label.textContent = "Выполнено";

          input.addEventListener("change", () => {
            progress[step.id] = input.checked;
            saveProgress(progress);
            node.classList.toggle("is-completed", input.checked);
          });

          check.append(input, label);
          node.appendChild(check);
        }

        row.appendChild(node);
        wrapper.appendChild(row);
        flow.appendChild(wrapper);
      });

      gates.innerHTML = `<strong>Архитектурные ворота</strong><ul class="gate-list">${view.gates.map((gate) => `<li>${gate}</li>`).join("")}</ul>`;

      buttons.forEach((button) => {
        const selected = button.dataset.view === viewName;
        button.classList.toggle("btn-primary", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      if (typeof lucide !== "undefined") {
        lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.view));
    });

    render("current");
  })();
</script>
